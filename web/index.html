<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据可信度验证大屏</title>
<link rel="stylesheet" href="/style.css">
<script src="/vendor/socket.io.min.js"></script>
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <div class="blob blob-cyan"></div>
  <div class="blob blob-violet"></div>
  <div class="blob blob-teal"></div>
</div>

<header>
  <div class="title">面向安全决策AI的数据可信度验证系统
    <span class="sub">REAL-TIME CREDIBILITY SCORE · LIQUID GLASS</span>
  </div>
  <div class="view-switch">
    <button id="btn-view-curve" class="vs-btn active" type="button">评分曲线</button>
    <button id="btn-view-star" class="vs-btn" type="button">态势星图</button>
  </div>
  <div class="phase-pill" id="phase">等待数据…</div>
</header>

<main>
  <section id="chart-card" class="glass">
    <div id="chart"></div>
  </section>
  <section id="star-card" class="glass">
    <div id="star-chart"></div>
  </section>
  <aside>
    <div class="card glass">
      <h3>当前可信分</h3>
      <div id="current">--</div>
      <div class="stats">
        <span>已评分 <b id="n-total">0</b></span>
        <span>阻断 <b id="n-block">0</b></span>
        <span>阈值 <b>60</b></span>
      </div>
    </div>
    <div class="card glass" id="explain-card">
      <h3>可解释输出 · 特征可疑度</h3>
      <div class="layers">
        <div class="meter"><span>HMAC</span><div class="bar"><div class="fill" id="lay-hmac"></div></div><b id="lay-hmac-v">0%</b></div>
        <div class="meter"><span>统计</span><div class="bar"><div class="fill" id="lay-stat"></div></div><b id="lay-stat-v">0%</b></div>
        <div class="meter"><span>规则</span><div class="bar"><div class="fill" id="lay-rule"></div></div><b id="lay-rule-v">0%</b></div>
      </div>
      <div id="explain-chart"></div>
    </div>
    <div class="card glass" id="block-card">
      <h3>阻断告警</h3>
      <div id="block-list"><div class="empty">暂无阻断事件</div></div>
    </div>
  </aside>
</main>

<script src="/star.js"></script>
<script src="/app.js"></script>
</body>
</html>
